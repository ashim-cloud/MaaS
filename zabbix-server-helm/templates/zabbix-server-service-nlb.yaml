{{/*
=============================================================================
Zabbix Server — NLB Service (Active Node Only)
=============================================================================
Internet-facing Network Load Balancer for external Zabbix agent connections.

Selector includes the HA role label (default: "role: active") so traffic
is routed only to the active HA node. The "role" label is set by the
ha-label-sidecar container running in each server pod.

Until the sidecar sets the label, NO pods match — this is intentional
(no traffic until HA election completes).

External agents connect to this NLB hostname on port 10051.

Change from original: NLB Service now includes aws-load-balancer-subnets
annotation (wired from vpc.publicSubnetIds). Original had no subnet annotation.
*/}}

{{- if .Values.zabbixServer.nlbService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zabbix-server.activeServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix-server.labels" . | nindent 4 }}
    app: zabbix-server
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: {{ .Values.zabbixServer.nlbService.scheme | quote }}
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: "preserve_client_ip.enabled={{ .Values.zabbixServer.nlbService.preserveClientIp }}"
    {{- if .Values.zabbixServer.nlbService.loadBalancerName }}
    service.beta.kubernetes.io/aws-load-balancer-name: {{ .Values.zabbixServer.nlbService.loadBalancerName | quote }}
    {{- end }}
    {{/* Explicit subnet placement from vpc.publicSubnetIds */}}
    service.beta.kubernetes.io/aws-load-balancer-subnets: {{ include "zabbix-server.subnetList" . | quote }}
spec:
  type: LoadBalancer
  selector:
    app: zabbix-server
    {{ .Values.zabbixServer.haSidecar.labelName }}: active
  ports:
    - port: 10051
      targetPort: 10051
{{- end }}
