{{/*
=============================================================================
Zabbix Server — RoleBinding (HA Label Patcher)
=============================================================================
Binds the HA label patcher Role to the HA sidecar ServiceAccount,
granting it permission to get/list/patch pods in the release namespace.
*/}}

{{- if .Values.zabbixServer.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "zabbix-server.roleBindingName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix-server.labels" . | nindent 4 }}
    app: zabbix-server
subjects:
  - kind: ServiceAccount
    name: {{ include "zabbix-server.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "zabbix-server.roleName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
