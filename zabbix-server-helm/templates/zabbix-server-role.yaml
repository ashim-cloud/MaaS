{{/*
=============================================================================
Zabbix Server — Role (HA Label Patcher)
=============================================================================
Namespace-scoped Role granting get, list, and patch on pods.
The HA label sidecar needs these permissions to:
  - Read its own pod name and current labels
  - Patch the HA role label (active/standby) based on Postgres HA state

Scoped to the release namespace only — no cluster-wide access.
*/}}

{{- if .Values.zabbixServer.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "zabbix-server.roleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix-server.labels" . | nindent 4 }}
    app: zabbix-server
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
{{- end }}
