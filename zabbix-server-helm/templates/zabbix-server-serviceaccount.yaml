{{/*
=============================================================================
Zabbix Server — ServiceAccount
=============================================================================
ServiceAccount for the HA label sidecar. Used by both the sidecar
(to patch pod labels via kubectl) and the Zabbix Server container
(shared pod-level identity).

Also used by EKS Pod Identity to assume the IAM role that grants
ssm:GetParameter* and kms:Decrypt for the DB credential parameters.

Prerequisites:
  - IAM role created (see docs/eks-prerequisites.md)
  - EKS Pod Identity association created for this ServiceAccount
    (via aws eks create-pod-identity-association)
*/}}

{{- if .Values.zabbixServer.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zabbix-server.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix-server.labels" . | nindent 4 }}
    app: zabbix-server
{{- end }}
