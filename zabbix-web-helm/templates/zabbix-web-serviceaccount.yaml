{{/*
=============================================================================
Zabbix Web — ServiceAccount
=============================================================================
ServiceAccount used by EKS Pod Identity to assume the Zabbix IAM role.

The IAM role must have permissions to:
  - ssm:GetParameter* on the DB credential parameters
  - kms:Decrypt on the KMS key used to encrypt those parameters

Prerequisites:
  - IAM role created (see docs/eks-prerequisites.md)
  - EKS Pod Identity association created for this ServiceAccount
    (via aws eks create-pod-identity-association — NOT via values.yaml)
*/}}

{{- if .Values.zabbixWeb.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zabbix-web.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix-web.labels" . | nindent 4 }}
    app: zabbix-web
{{- end }}
