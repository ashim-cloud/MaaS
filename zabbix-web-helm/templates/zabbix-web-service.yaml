{{/*
=============================================================================
Zabbix Web — ClusterIP Service
=============================================================================
Internal service for the ALB Ingress to route to.
Traffic flow: ALB → Service (port 80) → Pod (targetPort 8080)
*/}}

{{- if .Values.zabbixWeb.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zabbix-web.deploymentName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix-web.labels" . | nindent 4 }}
    app: zabbix-web
spec:
  type: {{ .Values.zabbixWeb.service.type }}
  selector:
    app: zabbix-web
  ports:
    - port: {{ .Values.zabbixWeb.service.port }}
      targetPort: {{ .Values.zabbixWeb.service.targetPort }}
{{- end }}
