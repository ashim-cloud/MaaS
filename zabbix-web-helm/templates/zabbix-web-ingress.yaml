{{/*
=============================================================================
Zabbix Web — ALB Ingress
=============================================================================
This Ingress handles the Zabbix web frontend:
  monitoring.prestacknx.co.in → zabbix-web Service (port 80 internally)

ALB-level configuration (scheme, subnets, ACM cert, WAF, SSL policy,
group name) is centralized in the IngressClassParams resource
(alb-public / maas-public-alb). This Ingress only defines:
  - Per-target-group settings (target-type, health check, backend protocol)
  - Per-rule settings (ssl-redirect)
  - Host-based routing rule

Required values:
  zabbixWeb.ingress.zabbixHost  — Zabbix subdomain (domain name)
*/}}

{{- if .Values.zabbixWeb.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zabbix-web.ingressName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix-web.labels" . | nindent 4 }}
    app: zabbix-web
  annotations:
    # ── ALB name (shared across all Ingresses in the group) ──────────────────
    alb.ingress.kubernetes.io/load-balancer-name: {{ .Values.ingress.loadBalancerName | quote }}

    # ── Per-target-group settings ────────────────────────────────────────────
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP

    # ── Health check (per-target-group) ──────────────────────────────────────
    # Zabbix has no dedicated health endpoint — root path (/) returns HTTP 200.
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthCheck.path | quote }}
    alb.ingress.kubernetes.io/success-codes: {{ .Values.ingress.healthCheck.successCodes | quote }}

    # ── HTTP → HTTPS redirect (per-rule) ─────────────────────────────────────
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"

spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    {{- if .Values.zabbixWeb.ingress.zabbixHost }}
    - host: {{ .Values.zabbixWeb.ingress.zabbixHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "zabbix-web.deploymentName" . }}
                port:
                  number: {{ .Values.zabbixWeb.service.port }}
    {{- else }}
    {{/* No host set — catch-all rule. Use this before Route53 is configured. */}}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "zabbix-web.deploymentName" . }}
                port:
                  number: {{ .Values.zabbixWeb.service.port }}
    {{- end }}

{{- end }}
