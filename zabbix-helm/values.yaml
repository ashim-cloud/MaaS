# =============================================================================
# Zabbix Helm Chart — values.yaml
# =============================================================================
# This file defines all configurable values for the Zabbix monitoring stack.
# Defaults here match the original manually-tested manifests unless noted.
# =============================================================================

# ---------------------------------------------------------------------------
# Global Settings
# ---------------------------------------------------------------------------

namespace:
  # -- Whether the chart should create the namespace itself.
  # Set to false if the namespace already exists or is managed externally.
  create: true
  # -- Target namespace for all Zabbix resources.
  name: "zabbix-prod"

zabbix:
  # -- Zabbix version — single source of truth for all three image tags.
  version: "7.0.27"
  # -- Base image variant (e.g. "ubuntu", "alpine", "ol").
  baseImage: "ubuntu"

vpc:
  # -- REQUIRED. AWS VPC ID where the EKS cluster runs.
  # Used for documentation/reference; the LB Controller itself reads it at
  # install time via its own --set vpcId flag.
  id: ""
  # -- REQUIRED. List of public subnet IDs for NLB + ALB placement.
  # Must contain at least 2 subnets (AWS requires 2+ AZs for ALB).
  # Example: ["subnet-aaa", "subnet-bbb", "subnet-ccc"]
  # Wired into BOTH the zabbix-server-active NLB Service annotations
  # AND the zabbix-web-ingress ALB Ingress annotations.
  publicSubnetIds: []

# ---------------------------------------------------------------------------
# Database — External RDS PostgreSQL
# ---------------------------------------------------------------------------
# The chart templates a Kubernetes Secret from these values.
# The RDS instance, database, and user must already exist before chart install.

db:
  # -- REQUIRED. RDS endpoint hostname (no default — must be supplied).
  host: ""
  # -- PostgreSQL port.
  port: 5432
  # -- Database name.
  name: "zabbix"
  # -- Database user.
  user: "zabbix"
  # -- REQUIRED. Database password.
  # Supply ONLY via --set db.password=... at install time.
  # Never commit this value to a file.
  # Uses Helm required() — omitting this will fail validation immediately.
  password: ""

# ---------------------------------------------------------------------------
# Zabbix Server — StatefulSet (Native HA)
# ---------------------------------------------------------------------------

zabbixServer:
  # -- Number of server replicas. Zabbix native HA supports 2+ nodes;
  # one will be elected active, the rest are standby.
  replicaCount: 2

  image:
    # -- Server image repository. Tag is auto-composed from zabbix.baseImage
    # and zabbix.version (e.g. zabbix/zabbix-server-pgsql:ubuntu-7.0.27).
    repository: "zabbix/zabbix-server-pgsql"

  # -- Pod anti-affinity to spread server pods across nodes.
  affinity:
    # -- "preferred" (soft) or "required" (hard).
    # Original manifest uses "preferred".
    type: "preferred"
    # -- Weight for preferred anti-affinity (1-100). Ignored if type=required.
    weight: 100

  # -- HA label sidecar — reads HA state from Postgres and patches pod labels.
  haSidecar:
    # -- Sidecar image. alpine/k8s includes kubectl and psql prerequisites.
    image: "alpine/k8s:1.31.0"
    # -- Label name applied to pods to indicate HA role (active/standby).
    # This label is also used in the NLB Service selector.
    labelName: "role"
    # -- How often (seconds) the sidecar polls Postgres for HA state.
    pollIntervalSeconds: 10

  # -- NLB Service configuration for external agent2 connectivity.
  service:
    nlb:
      # -- "internet-facing" or "internal".
      scheme: "internet-facing"
      # -- Preserve the original client IP for agent2 connections.
      preserveClientIp: true

# ---------------------------------------------------------------------------
# Zabbix Web — Deployment (nginx + pgsql frontend)
# ---------------------------------------------------------------------------

zabbixWeb:
  # -- Number of web frontend replicas.
  replicaCount: 2

  image:
    # -- Web image repository. Tag is auto-composed like the server image.
    repository: "zabbix/zabbix-web-nginx-pgsql"

  # -- PHP timezone for the Zabbix frontend.
  phpTz: "Asia/Kolkata"

  # -- ALB Ingress configuration.
  ingress:
    # -- "internet-facing" or "internal".
    scheme: "internet-facing"
    # -- Hostname for the Ingress rule. Empty string = catch-all (no host filter).
    # Set this when you have a Route53 domain (e.g. "zabbix.example.com").
    host: ""

# ---------------------------------------------------------------------------
# Zabbix Agent2 — DaemonSet (one per node)
# ---------------------------------------------------------------------------

zabbixAgent2:
  image:
    # -- Agent2 image repository. Tag is auto-composed like the server image.
    repository: "zabbix/zabbix-agent2"

  # -- Use the host's network namespace for real node-level metrics.
  hostNetwork: true
  # -- Use the host's PID namespace for process-level monitoring.
  hostPID: true

  # -- Override the Zabbix server service name that agent2 connects to.
  # Empty string = auto (uses the chart's NLB service name).
  # Only set this if agent2 should connect to an external Zabbix server.
  serverActiveServiceName: ""
