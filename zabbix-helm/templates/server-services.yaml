{{/*
=============================================================================
Zabbix Server — Services (Headless + NLB)
=============================================================================
Two services in one file, matching the original zabbix-server-ha.yaml:

1. Headless Service — for StatefulSet pod DNS (zabbix-server-0.zabbix-server.ns)
2. NLB Service — internet-facing LoadBalancer for external agent connections,
   selects only the pod with role=active (set by the HA sidecar)

Change from original: NLB Service now includes aws-load-balancer-subnets
annotation (wired from vpc.publicSubnetIds). Original had no subnet annotation.
*/}}

# --------------------------------------------------------------------------
# Headless Service — StatefulSet pod DNS
# --------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zabbix.serverName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
    app: zabbix-server
spec:
  clusterIP: None
  selector:
    app: zabbix-server
  ports:
    - port: 10051
      targetPort: 10051

---

# --------------------------------------------------------------------------
# NLB Service — external access for remote Zabbix agent clients
# --------------------------------------------------------------------------
# Selector includes "role: active" so traffic is routed only to the
# active HA node. The "role" label is set by the ha-label-sidecar.
# Until the sidecar sets the label, NO pods match — this is intentional
# (no traffic until HA election completes).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zabbix.serverActiveServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
    app: zabbix-server
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: {{ .Values.zabbixServer.service.nlb.scheme | quote }}
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: "preserve_client_ip.enabled={{ .Values.zabbixServer.service.nlb.preserveClientIp }}"
    {{/* NEW vs. original: explicit subnet placement from vpc.publicSubnetIds */}}
    service.beta.kubernetes.io/aws-load-balancer-subnets: {{ include "zabbix.subnetList" . | quote }}
spec:
  type: LoadBalancer
  selector:
    app: zabbix-server
    {{ .Values.zabbixServer.haSidecar.labelName }}: active
  ports:
    - port: 10051
      targetPort: 10051
