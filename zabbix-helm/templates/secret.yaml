{{/*
=============================================================================
Secret — Database credentials for external RDS PostgreSQL
=============================================================================
Keys: host, port, user, password, dbname
Matches the original "zabbix-db-secret" structure exactly.
Uses stringData (Kubernetes auto-base64-encodes at apply time).

db.host and db.password are validated with required() — omitting either
will fail Helm validation immediately rather than deploying a broken Secret.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zabbix.secretName" . }}
  namespace: {{ include "zabbix.namespace" . }}
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
type: Opaque
stringData:
  host: {{ required "db.host is required — set to your RDS endpoint" .Values.db.host | quote }}
  port: {{ .Values.db.port | quote }}
  user: {{ .Values.db.user | quote }}
  password: {{ required "db.password is required — supply via --set db.password=... only, never commit to a file" .Values.db.password | quote }}
  dbname: {{ .Values.db.name | quote }}
