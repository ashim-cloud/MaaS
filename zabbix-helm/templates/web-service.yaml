{{/*
=============================================================================
Zabbix Web — ClusterIP Service
=============================================================================
Internal service for the ALB Ingress to route to.
Identical to the original: port 80 → targetPort 8080.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zabbix.webName" . }}
  namespace: {{ include "zabbix.namespace" . }}
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
    app: zabbix-web
spec:
  type: ClusterIP
  selector:
    app: zabbix-web
  ports:
    - port: 80
      targetPort: 8080
