{{/*
=============================================================================
RBAC — ServiceAccount, Role, RoleBinding for the HA label sidecar
=============================================================================
Scoped to the release namespace. The sidecar needs get/list/patch on pods
to read its own pod name and update the HA role label.

Original names: zabbix-ha-sidecar, zabbix-ha-label-patcher,
zabbix-ha-label-patcher-binding
Helm names: {{ Release.Name }}-ha-sidecar, etc. (identical when release = "zabbix")
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zabbix.saName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "zabbix.roleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "zabbix.roleBindingName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "zabbix.saName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "zabbix.roleName" . }}
  apiGroup: rbac.authorization.k8s.io
