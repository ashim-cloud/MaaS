{{/*
=============================================================================
Zabbix Agent2 — DaemonSet (one pod per node)
=============================================================================
Faithful conversion of the original zabbix-agent2-daemonset.yaml.

Key behaviors preserved:
- hostNetwork + hostPID for real node-level metrics
- NODE_NAME via Downward API (spec.nodeName) → ZBX_HOSTNAME
  This is the hostname-collision fix: each node registers as a distinct
  Zabbix host using its Kubernetes node name instead of the pod name.
- hostPort 10050 for direct agent accessibility
*/}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "zabbix.agent2Name" . }}
  namespace: {{ include "zabbix.namespace" . }}
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
    app: zabbix-agent2
spec:
  selector:
    matchLabels:
      app: zabbix-agent2
  template:
    metadata:
      labels:
        {{- include "zabbix.labels" . | nindent 8 }}
        app: zabbix-agent2
    spec:
      hostNetwork: {{ .Values.zabbixAgent2.hostNetwork }}
      hostPID: {{ .Values.zabbixAgent2.hostPID }}
      containers:
        - name: zabbix-agent2
          image: {{ include "zabbix.agent2Image" . }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ZBX_HOSTNAME
              value: $(NODE_NAME)
            - name: ZBX_SERVER_HOST
              value: {{ include "zabbix.resolvedServerServiceName" . | quote }}
          ports:
            - containerPort: 10050
              hostPort: 10050
