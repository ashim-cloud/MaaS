{{/*
=============================================================================
Zabbix Server — StatefulSet (Native HA)
=============================================================================
Faithful conversion of the original zabbix-server-ha.yaml StatefulSet.

Key behaviors preserved from the original:
- serviceName matches the headless Service for stable pod DNS
- POD_NAME via Downward API → ZBX_HANODENAME for Zabbix HA node registration
- Two containers: zabbix-server + ha-label-sidecar
- Sidecar polls Postgres ha_node table and patches pod labels

Changes from original (see implementation_plan.md for full diff):
- Secret name, ServiceAccount name, image tag are templated
- Sidecar label name and poll interval are parameterized
- Resource requests/limits added (not in original)
- Affinity type is switchable between preferred/required
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zabbix.serverName" . }}
  namespace: {{ include "zabbix.namespace" . }}
  labels:
    {{- include "zabbix.labels" . | nindent 4 }}
    app: zabbix-server
spec:
  serviceName: {{ include "zabbix.serverName" . }}
  replicas: {{ .Values.zabbixServer.replicaCount }}
  selector:
    matchLabels:
      app: zabbix-server
  template:
    metadata:
      labels:
        {{- include "zabbix.labels" . | nindent 8 }}
        app: zabbix-server
    spec:
      serviceAccountName: {{ include "zabbix.saName" . }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.zabbixServer.affinity.type "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - zabbix-server
              topologyKey: "kubernetes.io/hostname"
          {{- else }}
          {{/* Default: preferred (matches original manifest) */}}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.zabbixServer.affinity.weight }}
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - zabbix-server
                topologyKey: "kubernetes.io/hostname"
          {{- end }}
      containers:
        # -----------------------------------------------------------------
        # Container 1: Zabbix Server
        # -----------------------------------------------------------------
        - name: zabbix-server
          image: {{ include "zabbix.serverImage" . }}
          env:
            - name: DB_SERVER_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "zabbix.secretName" . }}
                  key: host
            - name: DB_SERVER_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "zabbix.secretName" . }}
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "zabbix.secretName" . }}
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zabbix.secretName" . }}
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "zabbix.secretName" . }}
                  key: dbname
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ZBX_HANODENAME
              value: $(POD_NAME)
          ports:
            - containerPort: 10051

        # -----------------------------------------------------------------
        # Container 2: HA Label Sidecar
        # -----------------------------------------------------------------
        # Polls Postgres ha_node table to determine which server pod is the
        # active HA node, then patches the pod's label so the NLB Service
        # selector routes traffic only to the active instance.
        - name: ha-label-sidecar
          image: {{ .Values.zabbixServer.haSidecar.image }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "zabbix.secretName" . }}
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zabbix.secretName" . }}
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "zabbix.secretName" . }}
                  key: dbname
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "zabbix.secretName" . }}
                  key: host
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache postgresql-client >/dev/null 2>&1
              while true; do
                ACTIVE_NODE=$(PGPASSWORD=$POSTGRES_PASSWORD psql -h $DB_HOST -U $POSTGRES_USER -d $POSTGRES_DB -tAc \
                  "SELECT name FROM ha_node WHERE status=3 LIMIT 1;" 2>/dev/null)

                if [ "$ACTIVE_NODE" = "$POD_NAME" ]; then
                  ROLE="active"
                else
                  ROLE="standby"
                fi

                kubectl label pod "$POD_NAME" -n "$POD_NAMESPACE" {{ .Values.zabbixServer.haSidecar.labelName }}=$ROLE --overwrite >/dev/null 2>&1
                echo "$(date): $POD_NAME is $ROLE"
                sleep {{ .Values.zabbixServer.haSidecar.pollIntervalSeconds }}
              done
