{{/*
=============================================================================
Grafana — ServiceAccount
=============================================================================
Used by EKS Pod Identity to assume the IAM role that grants
ssm:GetParameter* and kms:Decrypt for Grafana DB credential parameters.

Prerequisites:
  - IAM role created with SSM + KMS permissions
  - EKS Pod Identity association created for this ServiceAccount
    (via aws eks create-pod-identity-association)
*/}}

{{- if .Values.grafana.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grafana.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
    app: {{ include "grafana.deploymentName" . }}
{{- end }}
